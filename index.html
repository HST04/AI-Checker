
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T.A.I - Refined Tuscan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
      
      :root {
        --warm-bg: #FDF8F3; /* Lightened cream base */
        --deep-rust: #8A2B0E;
        --muted-lavender: #9988A1;
        --terracotta-accent: #E35336;
        --soft-text: #4A3731; /* Dark brownish charcoal for body readability */
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--warm-bg);
        color: var(--soft-text);
        margin: 0;
        padding: 0;
      }

      h1, h2, h3, h4 {
        color: var(--deep-rust);
        letter-spacing: -0.01em;
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--warm-bg); }
      ::-webkit-scrollbar-thumb { background: #EADEDA; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--muted-lavender); }

      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "clsx": "https://esm.sh/clsx@^2.1.1",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
        "tailwind-merge": "https://esm.sh/tailwind-merge@^3.4.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="h-screen overflow-hidden">
    <div id="root" class="h-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
